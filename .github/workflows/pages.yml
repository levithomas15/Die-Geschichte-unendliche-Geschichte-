name: Tests und GitHub-Pages-Vorschau

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  pages:
    needs: test
    # Nur der Standard-Branch wird veröffentlicht.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build-pages.mjs dist-pages
      - name: Auf den Branch gh-pages veröffentlichen
        working-directory: dist-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vorschau aus ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Pushes mit dem GITHUB_TOKEN starten laut GitHub-Doku keinen Pages-Build – deshalb ausdrücklich anfordern.
      - name: GitHub-Pages-Build anstoßen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json")
          # Die Build-Anfrage antwortet auch ohne eingeschaltetes Pages mit 201 – deshalb vorher prüfen.
          if ! curl -s "${auth[@]}" "$api" | grep '"has_pages": *true' > /dev/null; then
            echo "::warning::GitHub Pages ist noch nicht eingeschaltet. Einmalig: Settings → Pages → Deploy from a branch → gh-pages / (root) → Save."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${auth[@]}" "$api/pages/builds")
          if [ "$status" = "201" ]; then
            echo "Pages-Build angefordert: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          else
            echo "::warning::Pages-Build konnte nicht angefordert werden (HTTP $status)."
          fi
